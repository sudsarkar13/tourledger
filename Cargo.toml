[workspace]
resolver = "3"
members = ["crates/core", "crates/sync", "crates/devbridge", "src-tauri"]
default-members = ["crates/core", "crates/sync", "crates/devbridge"]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["v7"] }
crc32fast = "1"
csv = "1"
tempfile = "3"

# Keep build output small: this repo is built on machines with little free disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
