<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>TourLedger</title>
  </head>
  <body>
    <!-- Shown until the ledger is open (src/splash.ts). The art is the app icon. -->
    <div id="splash" role="status">
      <svg class="splash-mark" width="112" height="112" viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="splash-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b72e0" />
            <stop offset="0.6" stop-color="#2548a8" />
            <stop offset="1" stop-color="#1b2f6e" />
          </linearGradient>
        </defs>
        <rect width="1024" height="1024" rx="224" fill="url(#splash-bg)" />
        <rect x="236" y="176" width="552" height="672" rx="72" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.55" stroke-width="10" />
        <path class="splash-route" d="M346 676 C 346 520, 660 590, 660 430 C 660 340, 560 330, 480 330" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-dasharray="2 82" />
        <circle cx="346" cy="690" r="58" fill="#fff" />
        <g class="splash-pin">
          <path d="M452 238 c -66 0 -110 44 -110 104 c 0 76 110 170 110 170 s 110 -94 110 -170 c 0 -60 -44 -104 -110 -104 z" fill="#8ce0bd" />
          <circle cx="452" cy="342" r="38" fill="#1b2f6e" />
        </g>
      </svg>
      <strong>TourLedger</strong>
      <span class="splash-bar" aria-hidden="true"></span>
      <small>Opening your ledger…</small>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
