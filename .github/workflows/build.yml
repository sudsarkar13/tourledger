# Builds every platform, for a version tag or when started by hand. A tag also
# collects the desktop installers into a draft pre-release. Ordinary pushes and
# pull requests build nothing.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, args: "--bundles deb,rpm,appimage" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, args: "--bundles deb,rpm" }
          - { name: windows-x64, os: windows-latest, args: "--bundles nsis,msi" }
          - { name: windows-arm64, os: windows-11-arm, args: "--bundles nsis" }
          - { name: macos-universal, os: macos-latest, args: "--bundles dmg --target universal-apple-darwin", targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm test
        working-directory: ui
      - run: ui/node_modules/.bin/tauri build ${{ matrix.args }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: tourledger-${{ matrix.name }}
          path: |
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # A draft: the signed Android APK is added from the owner's machine, and a
  # person publishes it. Notes come from docs/releases/<tag>.md.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tourledger-{linux,windows,macos}-*
          path: installers
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease \
            --title "TourLedger ${GITHUB_REF_NAME#v} (early test)" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          find installers -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME"

  android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      # A debug APK is signed with a throwaway key: installable for testing,
      # not for distribution.
      - run: scripts/build.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: tourledger-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      # Simulator only. A phone build needs an Apple developer account.
      - run: scripts/build.sh ios

  freebsd:
    needs: test
    runs-on: ubuntu-24.04
    # Tauri does not officially support FreeBSD, so a failure here is reported
    # without blocking the other platforms.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust node npm webkit2-gtk_41 librsvg2-rust gmake pkgconf
          run: |
            cargo test
            npm install -g pnpm@11
            sh -c 'pnpm --dir ui install --frozen-lockfile && pnpm --dir ui build'
            cargo build --release -p tourledger --features tauri/custom-protocol
