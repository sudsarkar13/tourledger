[package]
name = "tourledger"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tour, expense and loan tracker"

[lib]
name = "tourledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tourledger-sync = { path = "../crates/sync" }
tourledger-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
gethostname = "1"
data-encoding = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.14"

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "freebsd")))'.dependencies]
tauri-plugin-single-instance = "2"
